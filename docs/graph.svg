<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <rect width="920" height="560" rx="12" fill="#1e1e1e"/>
  <!-- edges: repo → concept -->
  <g stroke="#4a4a4a" stroke-width="1.5">
    <line x1="210" y1="150" x2="330" y2="185"/><line x1="210" y1="150" x2="430" y2="265"/><line x1="210" y1="150" x2="255" y2="330"/>
    <line x1="210" y1="150" x2="185" y2="410"/><line x1="210" y1="150" x2="305" y2="445"/><line x1="210" y1="150" x2="160" y2="255"/><line x1="210" y1="150" x2="470" y2="85"/>
    <line x1="660" y1="200" x2="330" y2="185"/><line x1="660" y1="200" x2="430" y2="265"/><line x1="660" y1="200" x2="545" y2="170"/>
    <line x1="660" y1="200" x2="605" y2="380"/><line x1="660" y1="200" x2="700" y2="300"/><line x1="660" y1="200" x2="735" y2="420"/><line x1="660" y1="200" x2="565" y2="470"/>
  </g>
  <!-- edges: concept ↔ concept (共起) -->
  <g stroke="#6a6a6a" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="330" y1="185" x2="430" y2="265"/><line x1="255" y1="330" x2="185" y2="410"/><line x1="255" y1="330" x2="305" y2="445"/>
    <line x1="700" y1="300" x2="735" y2="420"/><line x1="605" y1="380" x2="545" y2="170"/><line x1="470" y1="85" x2="255" y2="330"/><line x1="430" y1="265" x2="305" y2="445"/>
  </g>
  <!-- repo nodes -->
  <g fill="#6080b0">
    <circle cx="210" cy="150" r="17"/><circle cx="660" cy="200" r="17"/>
  </g>
  <!-- concept nodes: 理解 黄緑 / 曖昧 黄 / 非理解 赤 / 霧 灰 -->
  <circle cx="545" cy="170" r="11" fill="#8bc34a"/>
  <circle cx="330" cy="185" r="12" fill="#ffeb3b"/><circle cx="430" cy="265" r="15" fill="#ffeb3b"/><circle cx="305" cy="445" r="11" fill="#ffeb3b"/><circle cx="160" cy="255" r="9" fill="#ffeb3b"/>
  <circle cx="255" cy="330" r="13" fill="#f44336"/><circle cx="185" cy="410" r="10" fill="#f44336"/>
  <circle cx="605" cy="380" r="9" fill="#9e9e9e"/><circle cx="700" cy="300" r="9" fill="#9e9e9e"/><circle cx="735" cy="420" r="8" fill="#9e9e9e"/><circle cx="565" cy="470" r="8" fill="#9e9e9e"/><circle cx="470" cy="85" r="8" fill="#9e9e9e"/>
  <!-- labels -->
  <g fill="#d4d4d4" font-size="13">
    <text x="210" y="122" text-anchor="middle" font-weight="600">worker</text>
    <text x="660" y="172" text-anchor="middle" font-weight="600">api</text>
    <text x="545" y="150" text-anchor="middle">早期リターン</text>
    <text x="330" y="166" text-anchor="middle">入力検証</text>
    <text x="430" y="243" text-anchor="middle">境界条件</text>
    <text x="305" y="470" text-anchor="middle">部分失敗の巻き戻し</text>
    <text x="160" y="235" text-anchor="middle">時刻の換算</text>
    <text x="255" y="357" text-anchor="middle">排他制御</text>
    <text x="185" y="435" text-anchor="middle">条件変数</text>
    <text x="605" y="404" text-anchor="middle">例外の伝播</text>
    <text x="700" y="282" text-anchor="middle">リトライ</text>
    <text x="735" y="444" text-anchor="middle">冪等性</text>
    <text x="565" y="494" text-anchor="middle">再帰</text>
    <text x="470" y="67" text-anchor="middle">状態機械</text>
  </g>
  <!-- legend -->
  <g font-size="12" fill="#bdbdbd">
    <circle cx="640" cy="512" r="6" fill="#8bc34a"/><text x="652" y="516">理解</text>
    <circle cx="700" cy="512" r="6" fill="#ffeb3b"/><text x="712" y="516">曖昧</text>
    <circle cx="760" cy="512" r="6" fill="#f44336"/><text x="772" y="516">非理解</text>
    <circle cx="832" cy="512" r="6" fill="#9e9e9e"/><text x="844" y="516">霧</text>
    <circle cx="640" cy="536" r="6" fill="#6080b0"/><text x="652" y="540">リポジトリ</text>
    <text x="722" y="540" fill="#8a8a8a">— — 同じ関数に付いた概念</text>
  </g>
  <text x="24" y="536" font-size="12" fill="#8a8a8a">架空のデータで描いた例。Obsidian の Graph view で概念がこう見える。</text>
</svg>
